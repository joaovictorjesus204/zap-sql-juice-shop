name: Segurança (ZAP) e dados (SQL)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Toda segunda-feira, 9h de Brasília
    - cron: '0 12 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  zap-e-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      # O Juice Shop roda dentro do próprio servidor do CI: a varredura nunca sai para a internet.
      juiceshop:
        image: bkimminich/juice-shop:latest
        ports:
          - 3000:3000
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Esperar o Juice Shop ficar pronto
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/rest/admin/application-version && exit 0
            sleep 3
          done
          echo "Juice Shop não ficou pronto" && exit 1

      - name: Varredura de segurança passiva (OWASP ZAP baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          # -a: inclui regras alfa; -j: usa o spider AJAX (o Juice Shop é uma SPA em Angular)
          cmd_options: '-a -j'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-juice-shop

      - name: Critério de aceite de segurança (nenhum alerta de risco alto)
        id: zap
        if: always()
        run: python3 zap/verificar_alertas.py report_json.json

      - name: Validação de dados com SQL no banco do Juice Shop
        id: sql
        if: always()
        run: |
          mkdir -p reports
          docker cp ${{ job.services.juiceshop.id }}:/juice-shop/data/juiceshop.sqlite reports/juiceshop.sqlite
          python3 sql/validar.py reports/juiceshop.sqlite reports/sql.html

      - name: Montar a página dos relatórios
        if: always()
        run: |
          mkdir -p reports
          cp report_html.html reports/zap-report.html || true
          cp pages/index.html reports/index.html

      - name: Guardar relatórios
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios
          path: reports

      - name: Preparar publicação
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports

  deploy-report:
    needs: zap-e-sql
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
